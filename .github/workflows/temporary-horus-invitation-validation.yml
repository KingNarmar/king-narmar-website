name: Temporary H.O.R.U.S Invitation Validation

on:
  push:
    branches:
      - feature/horus-invitation-landing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Preview route smoke
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/horus-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error 'http://127.0.0.1:4173/horus/invitation?token=test-token' > /tmp/horus-invitation.html; then
              break
            fi
            sleep 1
          done

          grep -q '<div id="root"></div>' /tmp/horus-invitation.html
