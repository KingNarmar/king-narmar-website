name: H.O.R.U.S Website Password Security

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/horus-password-security.yml"
      - "src/pages/HorusResetPasswordPage.tsx"
      - "src/pages/HorusAuthPage.css"
      - "src/features/horus-auth/**"
      - "tests/horusPassword*.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  horus-password-quality:
    name: H.O.R.U.S Password Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test H.O.R.U.S password policy and recovery
        run: npm run test:horus

      - name: Lint website
        run: npm run lint

      - name: Build website
        run: npm run build
